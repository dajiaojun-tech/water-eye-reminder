# ==========================================
# 喝水 / 护眼提醒 · 配置（改完退出程序再打开）
# ==========================================
# ---- 间隔（分钟）----
# 喝水间隔；建议能整除 60，这样才会落在整点上
water_minutes=30
# 护眼间隔
eye_minutes=20
# true = 对齐钟点（:00、:30）；false = 从启动那一刻开始数
align_clock=true

# ---- 卡片停留时间（秒）----
water_seconds=25
eye_seconds=20

# ---- 卡片文案（随便改；文字太长会自动缩字号）----
water_title=该喝水了
water_text=起身接杯水，慢慢喝完（约 400 毫升）
eye_title=该护眼了
eye_text=看向 6 米外的远处，保持 20 秒